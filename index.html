<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSeadragon + deck.gl</title>
  </head>
  <body>
    <main>
      <h1>OpenSeadragon + deck.gl</h1>
      <div class="scene" id="scene">
        <div class="image-viewer" id="image-viewer" aria-label="Highsmith image viewer"></div>
      </div>
      <div class="image-status">
        <span id="image-status" role="status"></span>
        <button id="image-retry" type="button" hidden>Retry image</button>
      </div>
      <p class="image-credit">
        Highsmith photograph from the
        <a href="https://openseadragon.github.io/examples/tilesource-dzi/">OpenSeadragon DZI example</a>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
