<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OpenSeadragon + deck.gl</title>
    <link rel="icon" href="/osd-deckgl-prototype/assets/favicon-DKXfrVAt.ico" />
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;color:#edf1f7;background:#11151c;font:1rem/1.5 system-ui,sans-serif}body{margin:0}main{max-width:90rem;margin:0 auto;padding:clamp(.75rem,3vw,2rem)}h1{margin:0 0 .25rem;font-size:clamp(1.4rem,3vw,2.2rem)}.subtitle{color:#aebbc9;margin:0 0 1rem}.scene{background:#080a0f;outline:1px solid #414c5c;height:clamp(18rem,74vh,65rem);position:relative}.image-viewer{position:absolute;inset:0}.image-viewer.is-unavailable{visibility:hidden}.image-viewer .has-hovered-path{cursor:pointer}.visually-hidden{clip-path:inset(50%);white-space:nowrap;block-size:1px;inline-size:1px;position:absolute;overflow:hidden}#graphics-status,.image-status{color:#aebbc9;overflow-wrap:anywhere}#graphics-status{margin:0 0 0 auto}#graphics-status:empty{position:absolute}.image-status{z-index:1;text-align:center;pointer-events:none;place-content:center;justify-items:center;gap:.5rem;padding:1rem;display:grid;position:absolute;inset:0}#image-status:not(:empty){background:#080a0f;padding:.25rem .5rem}#image-retry{pointer-events:auto}.deck-overlay{pointer-events:none;position:absolute;inset:0;overflow:hidden}.toolbar{flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:.75rem;display:flex}.toolbar fieldset{border:0;flex-wrap:wrap;align-items:center;gap:.4rem;min-inline-size:0;margin:0;padding:0;display:flex}.toolbar fieldset[hidden]{display:none}button,select{font:inherit;color:inherit;background:#222b39;border:1px solid #637288;border-radius:.35rem;padding:.3rem .65rem}button[aria-pressed=true]{background:#294568;border-color:#a0c9ff}button:enabled{cursor:pointer}button:enabled:hover,select:enabled:hover{border-color:#a0c9ff}button:disabled,select:disabled{opacity:.6}:focus-visible{outline-offset:2px;outline:2px solid #a0c9ff}#data-controls{column-gap:.75rem;margin-inline-start:auto}#data-controls label{align-items:center;gap:.35rem;display:flex}#path-count{inline-size:5.25rem}</style>
    <script type="module" crossorigin src="/osd-deckgl-prototype/assets/index-BWyDeGce.js"></script>
    <link rel="modulepreload" crossorigin href="/osd-deckgl-prototype/assets/array-utils-flat-BL8Cekj1.js">
    <link rel="modulepreload" crossorigin href="/osd-deckgl-prototype/assets/get-attribute-from-layouts-Dd2gixpo.js">
    <link rel="modulepreload" crossorigin href="/osd-deckgl-prototype/assets/expression-C4x9yiMU.js">
  </head>
  <body>
    <main>
      <h1>OpenSeadragon + deck.gl</h1>
      <p class="subtitle">
        OpenSeadragon viewport events keep deck.gl annotations aligned with the
        tiled image
      </p>
      <div class="toolbar">
        <fieldset id="camera-controls" aria-label="Camera" disabled>
          <button type="button" id="home">Home</button>
          <button type="button" id="zoom-in">Zoom in</button>
          <button type="button" id="zoom-out">Zoom out</button>
          <button type="button" id="rotate-left">Rotate left</button>
          <button type="button" id="rotate-right">Rotate right</button>
          <button type="button" id="flip" aria-pressed="false">
            Flip horizontal
          </button>
        </fieldset>
        <fieldset id="data-controls" aria-label="Confetti">
          <label
            >Paths
            <select id="path-count">
              <option value="10000">10k</option>
            </select></label
          >
          <button id="clear-selection" type="button">Clear selection</button>
          <button type="button" id="overlay-visible" aria-pressed="true">
            Show overlay
          </button>
          <span class="visually-hidden" id="selection-status" role="status"
            >No path selected</span
          >
        </fieldset>
        <p id="graphics-status" role="status"></p>
      </div>
      <div class="scene" id="scene">
        <div
          class="image-viewer"
          id="image-viewer"
          aria-label="Deep-zoom image viewer"
        ></div>
        <div class="image-status">
          <span id="image-status" role="status"></span>
          <button id="image-retry" type="button" hidden>Retry image</button>
        </div>
      </div>
    </main>
  </body>
</html>
